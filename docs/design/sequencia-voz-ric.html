<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RIC — sequência de voz</title>
  <style>
    :root {
      --paper: #f3f5f7;
      --ink: #1c2430;
      --muted: #5a6573;
      --soft: #8a93a0;
      --accent: #2f6f6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }
    header { width: min(960px, 100%); margin-bottom: 1.25rem; }
    header h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.45; max-width: 46rem; }
    .frame {
      width: min(960px, 100%);
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      border-radius: 12px;
      overflow: hidden;
    }
    svg { display: block; width: 100%; height: auto; }
    footer {
      width: min(960px, 100%);
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--soft);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>RIC — sequência wake → resposta</h1>
    <p>
      Um turno de conversa local: microfone → wake/STT → LLM com tools → TTS → ecrã.
      Tudo em <code>127.0.0.1</code>; sem cloud no caminho crítico.
    </p>
  </header>

  <div class="frame" role="img" aria-label="Diagrama de sequência do pipeline de voz do RIC">
    <!--
      diagram-design: sequence
      profile: ric-pap
      source: docs/ARQUITETURA.md §4.5, §5.6, §6.1, §6.4–6.5
    -->
    <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'IBM Plex Sans', system-ui, sans-serif">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#1c2430" />
        </marker>
        <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#8a93a0" />
        </marker>
      </defs>

      <rect width="960" height="620" fill="#ffffff" />

      <!-- Lifeline headers -->
      <rect x="48" y="36" width="120" height="44" rx="8" fill="#ffffff" stroke="#2f6f6a" stroke-width="2" />
      <text x="108" y="62" fill="#2f6f6a" font-size="13" font-weight="650" text-anchor="middle">Pessoa</text>

      <rect x="220" y="36" width="120" height="44" rx="8" fill="#ffffff" stroke="#1c2430" stroke-width="1.2" />
      <text x="280" y="62" fill="#1c2430" font-size="13" font-weight="600" text-anchor="middle">UI / WS</text>

      <rect x="392" y="36" width="120" height="44" rx="8" fill="#ffffff" stroke="#1c2430" stroke-width="1.2" />
      <text x="452" y="62" fill="#1c2430" font-size="13" font-weight="600" text-anchor="middle">voice</text>

      <rect x="564" y="36" width="120" height="44" rx="8" fill="#ffffff" stroke="#1c2430" stroke-width="1.2" />
      <text x="624" y="62" fill="#1c2430" font-size="13" font-weight="600" text-anchor="middle">llm</text>

      <rect x="736" y="36" width="120" height="44" rx="8" fill="#ffffff" stroke="#1c2430" stroke-width="1.2" />
      <text x="796" y="62" fill="#1c2430" font-size="13" font-weight="600" text-anchor="middle">db / tools</text>

      <!-- Lifelines -->
      <line x1="108" y1="80" x2="108" y2="580" stroke="#8a93a0" stroke-width="1" stroke-dasharray="3,4" />
      <line x1="280" y1="80" x2="280" y2="580" stroke="#8a93a0" stroke-width="1" stroke-dasharray="3,4" />
      <line x1="452" y1="80" x2="452" y2="580" stroke="#8a93a0" stroke-width="1" stroke-dasharray="3,4" />
      <line x1="624" y1="80" x2="624" y2="580" stroke="#8a93a0" stroke-width="1" stroke-dasharray="3,4" />
      <line x1="796" y1="80" x2="796" y2="580" stroke="#8a93a0" stroke-width="1" stroke-dasharray="3,4" />

      <!-- 1 wake -->
      <path d="M 108 110 H 440" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="200" y="102" fill="#5a6573" font-size="11">1. «ei RIC» ou botão Falar</text>

      <!-- 2 listening state -->
      <path d="M 452 140 H 292" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="300" y="132" fill="#5a6573" font-size="11">2. state: listening</text>

      <!-- 3 audio / STT -->
      <path d="M 108 180 H 440" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="180" y="172" fill="#5a6573" font-size="11">3. áudio → Whisper (STT)</text>

      <!-- 4 text to llm -->
      <path d="M 452 230 H 612" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="470" y="222" fill="#5a6573" font-size="11">4. texto + contexto</text>

      <!-- thinking UI -->
      <path d="M 624 260 H 292" fill="none" stroke="#8a93a0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)" />
      <text x="340" y="252" fill="#8a93a0" font-size="11">state: thinking</text>

      <!-- 5 tool call -->
      <path d="M 624 310 H 784" fill="none" stroke="#2f6f6a" stroke-width="1.4" marker-end="url(#arrow)" />
      <text x="640" y="302" fill="#2f6f6a" font-size="11">5. tool (ex. criar_lembrete)</text>

      <!-- 6 tool result -->
      <path d="M 796 350 H 636" fill="none" stroke="#2f6f6a" stroke-width="1.4" marker-end="url(#arrow)" />
      <text x="650" y="342" fill="#2f6f6a" font-size="11">6. resultado SQLite</text>

      <!-- 7 reply text -->
      <path d="M 624 400 H 464" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="480" y="392" fill="#5a6573" font-size="11">7. texto da resposta</text>

      <!-- 8 TTS -->
      <path d="M 452 450 H 292" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="300" y="442" fill="#5a6573" font-size="11">8. Piper TTS + state: speaking</text>

      <!-- 9 audio to person -->
      <path d="M 280 500 H 120" fill="none" stroke="#1c2430" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="130" y="492" fill="#5a6573" font-size="11">9. áudio no ecrã/colunas</text>

      <!-- 10 idle -->
      <path d="M 280 550 H 440" fill="none" stroke="#8a93a0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)" />
      <text x="300" y="542" fill="#8a93a0" font-size="11">10. state: idle (wake de novo)</text>

      <!-- Note box -->
      <rect x="520" y="520" width="360" height="56" rx="8" fill="rgba(28,36,48,0.03)" stroke="rgba(28,36,48,0.10)" stroke-width="0.8" />
      <text x="540" y="542" fill="#1c2430" font-size="11">Se Ollama falhar / timeout: frase de fallback,</text>
      <text x="540" y="560" fill="#5a6573" font-size="11">UI e lembretes continuam (núcleo offline).</text>
    </svg>
  </div>

  <footer>
    Fonte: <code>docs/ARQUITETURA.md</code> §4.5, §5.6, §6.1, §6.4–6.5 · Tokens RIC.
  </footer>
</body>
</html>
