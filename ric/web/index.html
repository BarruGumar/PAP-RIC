<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RIC — Companheiro</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Painel lateral">
      <div class="sidebar-brand">
        <div class="face-wrap" aria-hidden="true">
          <div id="ric-face" class="face listening" data-state="listening">
            <div class="face-eyes">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
            <div class="face-mouth"></div>
          </div>
        </div>
        <p class="brand-name">RIC</p>
        <p class="brand-tag">Companheiro local</p>
        <p id="llm-estado" class="llm-estado" role="status">A verificar LLM…</p>
        <p id="perfil-linha" class="perfil-linha" hidden></p>
      </div>

      <section class="side-block" aria-labelledby="tit-lembretes">
        <div class="side-head">
          <h2 id="tit-lembretes">Lembretes</h2>
          <span id="relogio" class="relogio" aria-live="polite"></span>
        </div>
        <ul id="lembretes" class="side-list"></ul>
        <p id="lista-vazia" class="vazia" hidden>Sem lembretes.</p>
      </section>

      <section class="side-block" aria-labelledby="tit-musicas">
        <div class="side-head">
          <h2 id="tit-musicas">Músicas</h2>
        </div>
        <div id="generos" class="chips" role="group" aria-label="Géneros musicais"></div>
        <ul id="musicas" class="side-list"></ul>
        <p id="musica-vazia" class="vazia" hidden>Pasta vazia. Vê `ric/musica/`.</p>
      </section>

      <div class="player" aria-label="Leitor de música">
        <p id="now-playing" class="now-playing">Nada a tocar</p>
        <p id="player-pos" class="player-pos">00:00 / 00:00</p>
        <div class="player-actions">
          <button type="button" id="btn-pausar" class="btn-mini" aria-label="Pausar música">Pausar</button>
          <button type="button" id="btn-continuar" class="btn-mini primary" aria-label="Continuar música">Continuar</button>
          <button type="button" id="btn-reiniciar" class="btn-mini" aria-label="Reiniciar do começo">Do começo</button>
        </div>
        <label class="volume-row" for="volume">
          <span>Volume</span>
          <input id="volume" type="range" min="0" max="100" value="70" aria-valuemin="0" aria-valuemax="100" />
          <span id="volume-label">70%</span>
        </label>
        <audio id="audio" controls preload="metadata"></audio>
      </div>
    </aside>

    <main class="chat-pane">
      <header class="chat-top">
        <p class="hero-brand">RIC</p>
        <h1>Estou aqui contigo</h1>
        <p class="lead">Agenda lembretes, pede uma história ou música — tudo no teu PC, sem cloud.</p>
      </header>

      <div id="chat-log" class="chat-log" aria-live="polite" aria-relevant="additions"></div>

      <form id="form-chat" class="composer">
        <label class="sr-only" for="chat-input">Mensagem</label>
        <textarea id="chat-input" rows="1" maxlength="500" required
                  placeholder="Escreve ou diz algo…"
                  aria-label="Mensagem para o RIC"></textarea>
        <div class="composer-actions">
          <label class="stt-lang-wrap" for="stt-lang">
            <span class="sr-only">Idioma do microfone</span>
            <select id="stt-lang" class="stt-lang" aria-label="Idioma do ditado" title="O Chrome reconhece melhor pt-BR">
              <option value="pt-BR" selected>Ditado: PT-BR</option>
              <option value="pt-PT">Ditado: PT-PT</option>
            </select>
          </label>
          <button type="button" id="btn-falar" class="btn btn-secondary" aria-label="Falar (ditado)">Falar</button>
          <button type="submit" id="btn-enviar" class="btn btn-primary">Enviar</button>
        </div>
      </form>
      <p id="chat-msg" class="msg" role="status" hidden></p>
      <p id="stt-nota" class="stt-nota" hidden></p>
    </main>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="alerta" role="alertdialog" aria-modal="true" aria-labelledby="alerta-titulo">
      <p class="alerta-kicker">É a hora</p>
      <h2 id="alerta-titulo"></h2>
      <p id="alerta-frase" class="alerta-frase"></p>
      <p id="alerta-meta" class="alerta-meta"></p>
      <div class="alerta-acoes">
        <button type="button" id="btn-ok" class="btn btn-primary btn-lg">Já fiz</button>
        <button type="button" id="btn-adiar" class="btn btn-secondary btn-lg">Adiar 10 min</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
