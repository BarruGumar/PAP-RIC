<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RIC</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/eye-shapes.css" />
</head>
<body>
  <main class="screen" id="app">
    <header class="top">
      <p class="brand" aria-label="RIC">RIC</p>
      <p id="next-reminder" class="next-pill" aria-live="polite">Próximo</p>
      <p class="clock" id="clock" aria-live="polite">--:--</p>
    </header>

    <section class="face-wrap" aria-live="polite">
      <div
        id="face"
        class="face theme-eve state-idle"
        data-expression="calm"
        data-eye-style="ring"
        role="img"
        aria-label="Estado: idle"
      >
        <svg class="face-svg" viewBox="0 0 200 120" aria-hidden="true">
          <defs>
            <filter id="eye-glow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <radialGradient id="eye-fill" cx="42%" cy="36%" r="70%">
              <stop offset="0%" stop-color="#f2ffff" />
              <stop offset="35%" stop-color="#6ee9ff" />
              <stop offset="78%" stop-color="#2bb8d6" />
              <stop offset="100%" stop-color="#178aa8" />
            </radialGradient>
            <pattern
              id="eye-scanlines"
              width="3"
              height="2.4"
              patternUnits="userSpaceOnUse"
            >
              <rect width="3" height="1.15" fill="rgba(6, 28, 42, 0.38)" />
            </pattern>
            <pattern
              id="eye-pixel-cols"
              width="2.6"
              height="2.6"
              patternUnits="userSpaceOnUse"
            >
              <rect x="1.9" width="0.7" height="2.6" fill="rgba(4, 20, 32, 0.18)" />
            </pattern>
            <clipPath id="clip-eye-left">
              <path
                class="eye-clip-path eye-clip-l"
                d="M 36,60 C 36,42.3 47.7,28 62,28 C 76.3,28 88,42.3 88,60 C 88,77.7 76.3,92 62,92 C 47.7,92 36,77.7 36,60 Z"
              />
            </clipPath>
            <clipPath id="clip-eye-right">
              <path
                class="eye-clip-path eye-clip-r"
                d="M 112,60 C 112,42.3 123.7,28 138,28 C 152.3,28 164,42.3 164,60 C 164,77.7 152.3,92 138,92 C 123.7,92 112,77.7 112,60 Z"
              />
            </clipPath>
          </defs>
          <g class="eyes-pair">
            <g class="eye-wrap eye-wrap-left">
              <path
                class="eye-bloom eye-bloom-l"
                filter="url(#eye-glow)"
                d="M 36,60 C 36,42.3 47.7,28 62,28 C 76.3,28 88,42.3 88,60 C 88,77.7 76.3,92 62,92 C 47.7,92 36,77.7 36,60 Z"
              />
              <path
                class="eye-shape eye-shape-l"
                d="M 36,60 C 36,42.3 47.7,28 62,28 C 76.3,28 88,42.3 88,60 C 88,77.7 76.3,92 62,92 C 47.7,92 36,77.7 36,60 Z"
              />
              <g clip-path="url(#clip-eye-left)">
                <rect
                  class="eye-scan"
                  x="28"
                  y="18"
                  width="70"
                  height="90"
                  fill="url(#eye-scanlines)"
                />
                <rect
                  class="eye-pixels"
                  x="28"
                  y="18"
                  width="70"
                  height="90"
                  fill="url(#eye-pixel-cols)"
                />
                <ellipse class="eye-pupil eye-pupil-l" cx="62" cy="61" rx="4.6" ry="9.2" />
                <ellipse
                  class="eye-ring eye-ring-l"
                  cx="62"
                  cy="60"
                  rx="24.2"
                  ry="30.2"
                  fill="none"
                />
                <ellipse class="eye-shine eye-shine-main" cx="51" cy="45" rx="5.2" ry="6.4" />
                <ellipse class="eye-shine eye-shine-spec" cx="56" cy="41" rx="2" ry="2.4" />
              </g>
            </g>
            <g class="eye-wrap eye-wrap-right">
              <path
                class="eye-bloom eye-bloom-r"
                filter="url(#eye-glow)"
                d="M 112,60 C 112,42.3 123.7,28 138,28 C 152.3,28 164,42.3 164,60 C 164,77.7 152.3,92 138,92 C 123.7,92 112,77.7 112,60 Z"
              />
              <path
                class="eye-shape eye-shape-r"
                d="M 112,60 C 112,42.3 123.7,28 138,28 C 152.3,28 164,42.3 164,60 C 164,77.7 152.3,92 138,92 C 123.7,92 112,77.7 112,60 Z"
              />
              <g clip-path="url(#clip-eye-right)">
                <rect
                  class="eye-scan"
                  x="104"
                  y="18"
                  width="70"
                  height="90"
                  fill="url(#eye-scanlines)"
                />
                <rect
                  class="eye-pixels"
                  x="104"
                  y="18"
                  width="70"
                  height="90"
                  fill="url(#eye-pixel-cols)"
                />
                <ellipse class="eye-pupil eye-pupil-r" cx="138" cy="61" rx="4.6" ry="9.2" />
                <ellipse
                  class="eye-ring eye-ring-r"
                  cx="138"
                  cy="60"
                  rx="24.2"
                  ry="30.2"
                  fill="none"
                />
                <ellipse class="eye-shine eye-shine-main" cx="127" cy="45" rx="5.2" ry="6.4" />
                <ellipse class="eye-shine eye-shine-spec" cx="132" cy="41" rx="2" ry="2.4" />
              </g>
            </g>
          </g>
        </svg>
      </div>
      <p id="state-label" class="state-label">À espera</p>
      <p id="heard" class="spoken" aria-live="polite"></p>
      <p id="spoken-hint" class="spoken-hint">(toque no ecrã para interagir)</p>
    </section>

    <div id="controls" class="controls" hidden>
      <aside class="library-panel" aria-label="Biblioteca local">
        <button
          type="button"
          id="btn-lib-music"
          class="btn btn-line btn-lib"
          data-library="musica"
          aria-label="Abrir biblioteca de músicas"
          aria-expanded="false"
        >
          Música
        </button>
        <button
          type="button"
          id="btn-lib-stories"
          class="btn btn-line btn-lib"
          data-library="historias"
          aria-label="Abrir coleção de histórias"
          aria-expanded="false"
        >
          Histórias
        </button>
        <button
          type="button"
          id="btn-lib-books"
          class="btn btn-line btn-lib"
          data-library="livros"
          aria-label="Abrir audiolivros locais"
          aria-expanded="false"
        >
          Livros
        </button>
        <div id="library-widget" class="floating-widget" hidden>
          <p class="widget-title" id="widget-title">Biblioteca local</p>
          <ul class="widget-list" id="library-list" aria-label="Itens da biblioteca">
            <li>Sem itens nesta pasta</li>
          </ul>
        </div>
      </aside>

      <div class="center-actions">
        <button type="button" id="btn-talk" class="btn btn-line btn-mic" aria-label="Carregar para falar">
          Falar
        </button>
        <button type="button" id="btn-add" class="btn btn-line" aria-label="Adicionar lembrete">
          + Lembrete
        </button>
      </div>

      <section id="create-panel" class="create" aria-label="Novo lembrete simples" hidden>
        <form id="form-create" class="form">
          <label>
            Título
            <input id="input-titulo" name="titulo" type="text" required maxlength="120" autocomplete="off" />
          </label>
          <label>
            Hora
            <input id="input-hora" name="hora" type="time" required />
          </label>
          <button type="submit" class="btn btn-line">Guardar</button>
          <p id="form-msg" class="form-msg" role="status"></p>
        </form>
      </section>
    </div>

    <section id="alert-panel" class="alert-panel hidden" aria-live="assertive">
      <p class="alert-badge">Lembrete agora</p>
      <p id="alert-title" class="alert-title">Lembrete</p>
      <p id="alert-time" class="alert-time"></p>
      <div class="alert-actions">
        <button type="button" id="btn-confirm" class="btn btn-primary" aria-label="Já fiz">Já fiz</button>
        <button type="button" id="btn-snooze" class="btn btn-quiet" aria-label="Adiar 10 minutos">Adiar (10 min)</button>
      </div>
    </section>

    <button
      type="button"
      id="btn-debug-toggle"
      class="debug-toggle"
      aria-label="Abrir laboratório PAP"
      aria-expanded="false"
      title="Atalho: tecla D"
    >
      Lab PAP
    </button>

    <aside id="debug-hud" class="debug-hud" hidden aria-label="Laboratório PAP">
      <div class="debug-header">
        <p class="debug-title">Laboratório PAP</p>
        <button type="button" id="btn-debug-close" class="debug-close" aria-label="Fechar laboratório">
          Fechar
        </button>
      </div>

      <div class="debug-section">
        <p class="debug-section-title">Voz</p>
        <button type="button" id="btn-preview" class="btn btn-line btn-debug" aria-label="Ouvir amostra da voz do RIC">
          Ouvir voz
        </button>
      </div>

      <div class="debug-section face-controls" aria-label="Cara EVE">
        <p class="debug-section-title">Versão dos olhos</p>
        <div class="eye-style-lab" role="group" aria-label="Versão dos olhos">
          <button
            type="button"
            class="btn btn-eye-style is-active"
            data-eye-style="ring"
            aria-pressed="true"
            aria-label="Olho A: anel e highlight"
          >
            Olho A · anel
          </button>
          <button
            type="button"
            class="btn btn-eye-style"
            data-eye-style="pupil"
            aria-pressed="false"
            aria-label="Olho B: anel, highlight e pupila"
          >
            Olho B · pupila
          </button>
        </div>
        <details class="expr-lab">
          <summary>Laboratório de expressões</summary>
          <div class="expr-grid" role="group" aria-label="Pré-visualizar expressões">
            <button type="button" class="btn btn-expr" data-expression="calm" aria-label="Calmo">Calmo</button>
            <button type="button" class="btn btn-expr" data-expression="curious" aria-label="Curioso">Curioso</button>
            <button type="button" class="btn btn-expr" data-expression="think" aria-label="A pensar">Pensar</button>
            <button type="button" class="btn btn-expr" data-expression="talk" aria-label="A falar">Falar</button>
            <button type="button" class="btn btn-expr" data-expression="alert" aria-label="Alerta">Alerta</button>
            <button type="button" class="btn btn-expr" data-expression="focus" aria-label="Focado">Focado</button>
            <button type="button" class="btn btn-expr" data-expression="happy" aria-label="Contente">Contente</button>
            <button type="button" class="btn btn-expr" data-expression="sad" aria-label="Triste">Triste</button>
            <button type="button" class="btn btn-expr" data-expression="surprised" aria-label="Surpreso">Surpreso</button>
            <button type="button" class="btn btn-expr" data-expression="sleepy" aria-label="Sonolento">Sono</button>
            <button type="button" class="btn btn-expr" data-expression="confused" aria-label="Confuso">Confuso</button>
            <button type="button" class="btn btn-expr" data-expression="wink" aria-label="Piscar um olho">Pisca</button>
            <button type="button" class="btn btn-expr" data-expression="blink" aria-label="Piscar">Piscar</button>
          </div>
        </details>
      </div>
    </aside>
  </main>
  <audio id="tts-player" preload="auto"></audio>
  <script src="/app.js"></script>
</body>
</html>
